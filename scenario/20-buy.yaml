expect:
- get:
    entity: Bill
    keys: [Bill, "${bill_northbio}"]
  fields:
    Status: Closed
- get:
    entity: Check
    keys: [Payment, "${chk_northbio}"]
  fields:
    Status: Closed
- get:
    entity: Bill
    keys: [Bill, "${bill_alpine}"]
  fields:
    Status: Closed
- get:
    entity: Check
    keys: [Payment, "${chk_alpine}"]
  fields:
    Status: Closed
- get:
    entity: Bill
    keys: [Bill, "${bill_nippon}"]
