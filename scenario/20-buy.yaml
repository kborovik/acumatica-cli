    - {POOrderType: Normal, POOrderNbr: "${po_alpine}", POLineNbr: 1, ReceiptQty: 5, Location: QCHOLD, LotSerialNbr: AB-ASH-25001, ExpirationDate: '2028-12-31'}
  capture: {ReceiptNbr: rcpt_alpine}
- id: release-rcpt-alpine
  action: {entity: PurchaseReceipt, name: ReleasePurchaseReceipt}
  record: {Type: Receipt, ReceiptNbr: "${rcpt_alpine}"}
  wait:
    entity: PurchaseReceipt
    keys: [Receipt, "${rcpt_alpine}"]
    until: {Status: Released}
- id: billnbr-alpine
  get:
    entity: Bill
    filter: "VendorRef eq 'PO-${po_alpine}'"
