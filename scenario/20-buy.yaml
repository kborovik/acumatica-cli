    Hold: false
    Details:
    - {DocType: Bill, ReferenceNbr: "${bill_alpine}", AmountPaid: 450.00}
  capture: {ReferenceNbr: chk_alpine}
- id: release-pay-alpine
  action: {entity: Check, name: ReleaseCheck}
  record: {Type: Payment, ReferenceNbr: "${chk_alpine}"}
  wait:
    entity: Check
    keys: [Payment, "${chk_alpine}"]
    until: {Status: Closed}
