scenario: buy
description: Buy kit-BOM raw materials (PO receipt bill+pay)
steps:
- id: po-northbio
  put: PurchaseOrder
  record:
    VendorID: VEND-NORTH-BIO
    Hold: false
    Details:
    - {InventoryID: RAW-ECH-EXT4, OrderQty: 5, UnitCost: 180.00}
    - {InventoryID: RAW-ELD-EXT10, OrderQty: 5, UnitCost: 220.00}
  capture: {OrderNbr: po_northbio}
- id: rcpt-northbio
  put: PurchaseReceipt
  record:
    Type: Receipt
    VendorID: VEND-NORTH-BIO
    Hold: false
    CreateBill: true
    VendorRef: "PO-${po_northbio}"
    Details:
    - {POOrderType: Normal, POOrderNbr: "${po_northbio}", POLineNbr: 1, ReceiptQty: 5, Location: QCHOLD, LotSerialNbr: NB-ECH-25001, ExpirationDate: '2028-12-31'}
    - {POOrderType: Normal, POOrderNbr: "${po_northbio}", POLineNbr: 2, ReceiptQty: 5, Location: QCHOLD, LotSerialNbr: NB-ELD-25001, ExpirationDate: '2028-12-31'}
  capture: {ReceiptNbr: rcpt_northbio}
- id: release-rcpt-northbio
  action: {entity: PurchaseReceipt, name: ReleasePurchaseReceipt}
  record: {Type: Receipt, ReceiptNbr: "${rcpt_northbio}"}
  wait:
    entity: PurchaseReceipt
    keys: [Receipt, "${rcpt_northbio}"]
    until: {Status: Released}
- id: billnbr-northbio
  get:
    entity: Bill
    filter: "VendorRef eq 'PO-${po_northbio}'"
    top: 1
  capture: {ReferenceNbr: bill_northbio}
- id: release-bill-northbio
  action: {entity: Bill, name: ReleaseBill}
  record: {Type: Bill, ReferenceNbr: "${bill_northbio}"}
  wait:
    entity: Bill
    keys: [Bill, "${bill_northbio}"]
    until: {Status: Open}
- id: pay-northbio
  put: Check
  record:
    Type: Payment
    Vendor: VEND-NORTH-BIO
    PaymentMethod: WIRE
    CashAccount: '10100'
    PaymentAmount: 2000.00
    PaymentRef: "WIRE-AP-${bill_northbio}"
    Hold: false
    Details:
    - {DocType: Bill, ReferenceNbr: "${bill_northbio}", AmountPaid: 2000.00}
  capture: {ReferenceNbr: chk_northbio}
- id: release-pay-northbio
  action: {entity: Check, name: ReleaseCheck}
  record: {Type: Payment, ReferenceNbr: "${chk_northbio}"}
  wait:
    entity: Check
    keys: [Payment, "${chk_northbio}"]
    until: {Status: Closed}
- id: po-alpine
  put: PurchaseOrder
  record:
    VendorID: VEND-ALPINE-EXT
    Hold: false
    Details:
    - {InventoryID: RAW-ASH-EXT5, OrderQty: 5, UnitCost: 90.00}
  capture: {OrderNbr: po_alpine}
- id: rcpt-alpine
  put: PurchaseReceipt
  record:
    Type: Receipt
    VendorID: VEND-ALPINE-EXT
    Hold: false
    CreateBill: true
    VendorRef: "PO-${po_alpine}"
