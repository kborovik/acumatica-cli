# Migrated AR documents (gh #72 / V68): one scenario per ERP document,
# each guarded on its external reference (CustomerOrder), so a re-run
# skips what exists and creates nothing twice. Transactions never get a
# seed file or catalog row.
scenario: ar-invoice
description: Migrated invoice (taxed)
once: true
present:
  get: {entity: SalesInvoice, filter: "CustomerOrder eq 'MIG-AR-INV-0001'"}
steps:
- id: put
  put: SalesInvoice
  record:
    Type: Invoice
    CustomerID: VITALPLUS
    CustomerOrder: MIG-AR-INV-0001
    Description: Migrated invoice (taxed)
    Amount: 271.20
    Hold: false
    FinancialDetails: {CustomerTaxZone: ONTARIO}
    Details:
    - {InventoryID: SVC-QCTEST, Qty: 2, UnitPrice: 120.00}
  capture: {ReferenceNbr: doc}
- id: release
  action: {entity: SalesInvoice, name: ReleaseSalesInvoice}
  record: {Type: Invoice, ReferenceNbr: "${doc}"}
  wait:
    entity: SalesInvoice
    keys: [Invoice, "${doc}"]
    until: {Status: Open}
expect:
- get: {entity: SalesInvoice, keys: [Invoice, "${doc}"]}
  fields: {Status: Open, TaxTotal: 31.2}
- inquire: AccountSummaryInquiry
  parameters: {Ledger: ACTUAL, Period: "${current_period}"}
  match: {Account: '24000'}
  delta: {EndingBalance: 31.20}
---
