---
# Finance Charge is not creatable through the contract API (500 "Index
# was outside the bounds of the array"; AR overdue-charge process only).
# A migrated finance charge lands as a Debit Memo on the same income
# account.
scenario: ar-finance-charge
description: Migrated finance charge
once: true
present:
  get: {entity: SalesInvoice, filter: "CustomerOrder eq 'MIG-AR-FC-0001'"}
steps:
- id: put
  put: SalesInvoice
  record:
    Type: Debit Memo
    CustomerID: VITALPLUS
    CustomerOrder: MIG-AR-FC-0001
    Description: Migrated finance charge
    Amount: 10.00
    Hold: false
    Details:
    - {TransactionDescr: Overdue charge, Account: '40100', Subaccount: '000000', Qty: 1, UnitPrice: 10.00}
  capture: {ReferenceNbr: doc}
- id: release
  action: {entity: SalesInvoice, name: ReleaseSalesInvoice}
  record: {Type: Debit Memo, ReferenceNbr: "${doc}"}
  wait:
    entity: SalesInvoice
    keys: [Debit Memo, "${doc}"]
    until: {Status: Open}
---
scenario: ar-prepayment
description: Migrated customer prepayment
once: true
present:
  get: {entity: Payment, filter: "PaymentRef eq 'MIG-AR-PP-0001'"}
steps:
- id: put
  put: Payment
  record:
    Type: Prepayment
    CustomerID: VITALPLUS
    PaymentMethod: WIRE
    CashAccount: '10100'
    PaymentAmount: 200.00
    PaymentRef: MIG-AR-PP-0001
    Hold: false
  capture: {ReferenceNbr: pmt}
- id: release
  action: {entity: Payment, name: ReleasePayment}
  record: {Type: Prepayment, ReferenceNbr: "${pmt}"}
  wait:
    entity: Payment
    keys: [Prepayment, "${pmt}"]
    until: {Status: Open}
