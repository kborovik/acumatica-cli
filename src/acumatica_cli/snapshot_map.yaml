# snapshot_map.yaml — package defaults for `acu reconcile` (V38)
#
# table → catalog entity. Optional keys:/fields: rename seed names →
# inventory columns so join/compare works when DAC names differ (M3).
# Global resolvers: + per-row resolves: map inv int FKs → CD (M4).
# Global enums: + per-row enums: map REST labels → DAC codes (M5).
# Data-repo root snapshot_map.yaml wins over this package file.
# v1 rows remain {table, entity} only — aliases/resolves/enums optional.

resolvers:
  account_cd:
    table: Account
    id: AccountID
    cd: AccountCD
  sub_cd:
    table: Sub
    id: SubID
    cd: SubCD
  branch_cd:
    table: Branch
    id: BranchID
    cd: BranchCD

enums:
  reason_usage:
    Adjustment: A
    Assembly/Disassembly: D
    Issue: I
    Receipt: R
    Vendor Return: N
  account_type:
    Asset: A
    Liability: L
    Income: I
    Expense: E
  post_option:
    Summary: S
    Detail: D
  due_type:
    Fixed Number of Days: N
  disc_type:
    Fixed Number of Days: N
  visible_to:
    All: AL
  prepare_on:
    Fixed Day of Month: F
  means_of_payment:
    Cash/Check: CHC
  item_type:
    Finished Good: F
  val_method:
    Average: A
  item_status:
    Active: AC
    Inactive: IN
    No Sales: NS
    No Purchases: NP
    No Request: NR
    Marked for Deletion: MD
  bool_bit:
    "true": "1"
    "false": "0"

tables:
  # Wave 1 renames — key/field aliases where seed ≠ DAC column
  - table: Sub
    entity: Subaccount
    keys:
      SubaccountCD: SubCD
    enums:
      Active: bool_bit
  - table: Terms
    entity: CreditTerms
    enums:
      DueType: due_type
      DiscType: disc_type
      VisibleTo: visible_to
  - table: UnitOfMeasure
    entity: UnitsOfMeasure
    keys:
      UnitID: Unit
    fields:
      Description: Descr
  - table: INAvailabilityScheme
    entity: AvailabilityCalculationRule
  - table: SOSetup
    entity: SOPreferences
    enums:
      AutoReleaseIN: bool_bit
      HoldShipments: bool_bit
      RequireShipmentTotal: bool_bit
      CreditCheckError: bool_bit
  - table: POSetup
    entity: POPreferences
    enums:
      HoldReceipts: bool_bit
      AutoReleaseIN: bool_bit
      AutoReleaseAP: bool_bit
  - table: ARSetup
    entity: ARPreferences
    enums:
      HoldEntry: bool_bit
      AutoPost: bool_bit
      RequireControlTotal: bool_bit
      RequireExtRef: bool_bit
      CreditCheckError: bool_bit
  - table: APSetup
    entity: APPreferences
    enums:
      HoldEntry: bool_bit
      AutoPost: bool_bit
      RequireControlTotal: bool_bit
      RequireVendorRef: bool_bit
      RequireApprovePayments: bool_bit

  # Wave 2 — table renames + PostingClass FK resolve
  - table: INPostClass
    entity: PostingClass
    resolves:
      COGSAcctID: account_cd
      COGSSubID: sub_cd
      InvtAcctID: account_cd
      InvtSubID: sub_cd
      LCVarianceAcctID: account_cd
      LCVarianceSubID: sub_cd
      POAccrualAcctID: account_cd
      POAccrualSubID: sub_cd
      PPVAcctID: account_cd
      PPVSubID: sub_cd
      SalesAcctID: account_cd
      SalesSubID: sub_cd
  - table: INItemClass
    entity: ItemClass
    keys:
      ClassID: ItemClassCD
    fields:
      Description: Descr
      StockItem: StkItem
      BaseUOM: BaseUnit
      AvailabilityCalculationRule: AvailabilitySchemeID
      PostingClass: PostClassID
    enums:
      StockItem: bool_bit
      ItemType: item_type
      ValuationMethod: val_method
  - table: INSite
    entity: Warehouse
    # Bootstrap seed key SiteCD; Default phases use WarehouseID (= SiteCD).
    keys:
      WarehouseID: SiteCD
    enums:
      Active: bool_bit
  # Warehouse locations detail table (IN204000 Locations tab). Header
  # compare stays on INSite; map clears unmapped for bin rows (V42).
  - table: INLocation
    entity: Warehouse
  - table: InventoryItem
    entity: StockItem
    keys:
      InventoryID: InventoryCD
    fields:
      Description: Descr
    enums:
      ItemStatus: item_status
  - table: INSetup
    entity: INPreferences
    enums:
      HoldEntry: bool_bit
      UpdateGL: bool_bit
      AutoPost: bool_bit
      SummPost: bool_bit
      NegQty: bool_bit
      RequireControlTotal: bool_bit
  - table: CASetup
    entity: CAPreferences
    enums:
      HoldEntry: bool_bit
      AutoPostOption: bool_bit
      ReleaseAP: bool_bit
      ReleaseAR: bool_bit
  - table: GLSetup
    entity: GLPreferences
    enums:
      AutoPostOption: bool_bit
      HoldEntry: bool_bit
      RequireControlTotal: bool_bit

  # Wave 3
  - table: INKitSpecHdr
    entity: KitSpecification
  - table: SOOrderType
    entity: OrderType
    resolves:
      FreightAcctID: account_cd
      FreightSubID: sub_cd
    enums:
      Active: bool_bit
  - table: ARStatementCycle
    entity: StatementCycle
    enums:
      PrepareOn: prepare_on
  - table: OrganizationLedgerLink
    entity: LedgerCompany

  # Identity tables — FK resolve (M4) + enums (M5)
  - table: Account
    entity: Account
    enums:
      Type: account_type
      PostOption: post_option
      Active: bool_bit
      RequireUnits: bool_bit
  - table: ReasonCode
    entity: ReasonCode
    resolves:
      AccountID: account_cd
      SubID: sub_cd
    enums:
      Usage: reason_usage
  - table: VendorClass
    entity: VendorClass
    resolves:
      APAcctID: account_cd
      APSubID: sub_cd
      DiscTakenAcctID: account_cd
      DiscTakenSubID: sub_cd
      ExpenseAcctID: account_cd
      ExpenseSubID: sub_cd
      POAccrualAcctID: account_cd
      POAccrualSubID: sub_cd
  - table: CashAccount
    entity: CashAccount
    resolves:
      AccountID: account_cd
      SubID: sub_cd
      BranchID: branch_cd
    enums:
      Active: bool_bit

  # T160 / V42 — Default masters (no Bootstrap bump). PaymentMethod joins on
  # PaymentMethodID; REST names differ from DAC. CustomerClass key ClassID →
  # CustomerClassID + account/sub FK resolve. PaymentMethodAccount = detail
  # cash-account rows (compare skips lists). Vendor/Customer identity tables
  # keep CD on BAccount — v1 no multi-table join (docs non-goal for BAccount).
  - table: PaymentMethod
    entity: PaymentMethod
    fields:
      Description: Descr
      Active: IsActive
      UseInAP: UseForAP
      UseInAR: UseForAR
      MeansOfPayment: PaymentType
    enums:
      Active: bool_bit
      UseInAP: bool_bit
      UseInAR: bool_bit
      MeansOfPayment: means_of_payment
  - table: PaymentMethodAccount
    entity: PaymentMethod
  - table: CustomerClass
    entity: CustomerClass
    keys:
      ClassID: CustomerClassID
    fields:
      Description: Descr
      Terms: TermsID
      CurrencyID: CuryID
      ARAccount: ARAcctID
      ARSubaccount: ARSubID
      SalesAccount: SalesAcctID
      SalesSubaccount: SalesSubID
      CashDiscountAccount: DiscTakenAcctID
      CashDiscountSubaccount: DiscTakenSubID
      StatementCycleID: StatementCycleId
    resolves:
      ARAccount: account_cd
      ARSubaccount: sub_cd
      SalesAccount: account_cd
      SalesSubaccount: sub_cd
      CashDiscountAccount: account_cd
      CashDiscountSubaccount: sub_cd
  - table: Vendor
    entity: Vendor
    fields:
      VendorClass: VendorClassID
      Terms: TermsID
  - table: Customer
    entity: Customer
    fields:
      CustomerClass: CustomerClassID

  # T146 Role/User (+ membership detail). Tables from SM201005/SM201010 /
  # UsersInRoles inventory; entity names = Bootstrap contract (T145).
  # Membership is not a top-level seed entity — UsersInRoles joins to User
  # (detail Roles); header Roles/Users map 1:1. Package 90-roles = full
  # pre-build CompanyID=1 role set.
  - table: Roles
    entity: Role
  - table: Users
    entity: User
    enums:
      IsApproved: bool_bit
      PasswordNeverExpires: bool_bit
      PasswordChangeOnNextLogin: bool_bit
  - table: UsersInRoles
    entity: User

  # T151 NumberingSequence (gh #25 / CS201010). Inventory detail table is
  # NumberingSequence (bounds rows); header DAC Numbering maps same entity
  # when present (Descr). Entity = Bootstrap contract flat NumberingSequence.
  - table: NumberingSequence
    entity: NumberingSequence
  - table: Numbering
    entity: NumberingSequence
