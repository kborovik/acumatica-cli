scenario: ar-invoice
description: Migrated invoice (taxed)
once: true
present:
  get: {entity: SalesInvoice, filter: "CustomerOrder eq 'MIG-AR-INV-0001'"}
steps:
- id: put
  put: SalesInvoice
  record:
    Type: Invoice
    CustomerID: ACMEMFG
    CustomerOrder: MIG-AR-INV-0001
    Description: Migrated invoice (taxed)
    Amount: 321.00
    Hold: false
    FinancialDetails: {CustomerTaxZone: INSTATE}
    Details:
    - {InventoryID: SVC-INSTALL, Qty: 2, UnitPrice: 150.00}
  capture: {ReferenceNbr: doc}
- id: release
  action: {entity: SalesInvoice, name: ReleaseSalesInvoice}
  record: {Type: Invoice, ReferenceNbr: "${doc}"}
  wait:
    entity: SalesInvoice
    keys: [Invoice, "${doc}"]
    until: {Status: Open}
expect:
- get: {entity: SalesInvoice, keys: [Invoice, "${doc}"]}
  fields: {Status: Open, TaxTotal: 21.0}
- inquire: AccountSummaryInquiry
  parameters: {Ledger: ACTUAL, Period: "${current_period}"}
  match: {Account: '24000'}
  delta: {EndingBalance: 21.00}
---
