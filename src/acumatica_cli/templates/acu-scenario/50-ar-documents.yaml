---
scenario: ar-prepayment
description: Migrated customer prepayment
once: true
present:
  get: {entity: Payment, filter: "PaymentRef eq 'MIG-AR-PP-0001'"}
steps:
- id: put
  put: Payment
  record:
    Type: Prepayment
    CustomerID: ACMEMFG
    PaymentMethod: WIRE
    CashAccount: '10100'
    PaymentAmount: 200.00
    PaymentRef: MIG-AR-PP-0001
    Hold: false
  capture: {ReferenceNbr: pmt}
- id: release
  action: {entity: Payment, name: ReleasePayment}
  record: {Type: Prepayment, ReferenceNbr: "${pmt}"}
  wait:
    entity: Payment
    keys: [Prepayment, "${pmt}"]
    until: {Status: Open}
