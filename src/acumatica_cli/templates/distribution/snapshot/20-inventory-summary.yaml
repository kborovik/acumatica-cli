# Snapshot view: on-hand qty (QtyOnHand-class, V33).
# inquire: InventorySummaryInquiry — same contract inquiry as run expects.
# WarehouseID pinned to distribution WH01; Results projected by InventoryID
# (+ LocationID when the inquiry expands locations). gi: LAB5-InventorySummary
# remains optional when a GI is V12-verified and Expose via OData is on.
name: inventory-summary
source:
  inquire: InventorySummaryInquiry
  params:
    WarehouseID: WH01
key:
  - InventoryID
  - LocationID
capture:
  - QtyOnHand
decimals: 2
