    VendorRef: "PO-${po_wavelink}"
    Details:
    - {POOrderType: Normal, POOrderNbr: "${po_wavelink}", POLineNbr: 1, ReceiptQty: 25}
    - {POOrderType: Normal, POOrderNbr: "${po_wavelink}", POLineNbr: 2, ReceiptQty: 8}
  capture: {ReceiptNbr: rcpt_wavelink}
- id: release-rcpt-wavelink
  action: {entity: PurchaseReceipt, name: ReleasePurchaseReceipt}
  record: {Type: Receipt, ReceiptNbr: "${rcpt_wavelink}"}
  wait:
    entity: PurchaseReceipt
    keys: [Receipt, "${rcpt_wavelink}"]
    until: {Status: Released}
- id: billnbr-wavelink
  get:
    entity: Bill
    filter: "VendorRef eq 'PO-${po_wavelink}'"
    top: 1
  capture: {ReferenceNbr: bill_wavelink}
- id: release-bill-wavelink
  action: {entity: Bill, name: ReleaseBill}
  record: {Type: Bill, ReferenceNbr: "${bill_wavelink}"}
  wait:
    entity: Bill
    keys: [Bill, "${bill_wavelink}"]
    until: {Status: Open}
- id: pay-wavelink
  put: Check
  record:
    Type: Payment
    Vendor: WAVELINK
    PaymentMethod: WIRE
    CashAccount: '10100'
    PaymentAmount: 428.00
    PaymentRef: "WIRE-AP-${bill_wavelink}"
    Hold: false
    Details:
    - {DocType: Bill, ReferenceNbr: "${bill_wavelink}", AmountPaid: 428.00}
  capture: {ReferenceNbr: chk_wavelink}
- id: release-pay-wavelink
  action: {entity: Check, name: ReleaseCheck}
  record: {Type: Payment, ReferenceNbr: "${chk_wavelink}"}
  wait:
    entity: Check
    keys: [Payment, "${chk_wavelink}"]
    until: {Status: Closed}
- id: po-memstor
  put: PurchaseOrder
  record:
    VendorID: MEMSTOR
    Hold: false
    Details:
    - {InventoryID: PSU-12V, OrderQty: 25, UnitCost: 18.00}
    - {InventoryID: SD-32GB, OrderQty: 25, UnitCost: 10.00}
    - {InventoryID: CBL-PWR, OrderQty: 25, UnitCost: 8.00}
  capture: {OrderNbr: po_memstor}
- id: rcpt-memstor
  put: PurchaseReceipt
  record:
    Type: Receipt
    VendorID: MEMSTOR
    Hold: false
    CreateBill: true
    VendorRef: "PO-${po_memstor}"
    Details:
    - {POOrderType: Normal, POOrderNbr: "${po_memstor}", POLineNbr: 1, ReceiptQty: 25}
    - {POOrderType: Normal, POOrderNbr: "${po_memstor}", POLineNbr: 2, ReceiptQty: 25}
    - {POOrderType: Normal, POOrderNbr: "${po_memstor}", POLineNbr: 3, ReceiptQty: 25}
  capture: {ReceiptNbr: rcpt_memstor}
- id: release-rcpt-memstor
