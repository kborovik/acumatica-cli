scenario: buy
description: Buy kit components (PO receipt bill+pay) for manufacturer build
steps:
- id: po-shenzhen
  put: PurchaseOrder
  record:
    VendorID: SHENZHEN
    Hold: false
    Details:
    - {InventoryID: MB-CM4, OrderQty: 25, UnitCost: 69.00}
    - {InventoryID: MOD-LTE, OrderQty: 8, UnitCost: 40.00}
  capture: {OrderNbr: po_shenzhen}
- id: rcpt-shenzhen
  put: PurchaseReceipt
  record:
    Type: Receipt
    VendorID: SHENZHEN
    Hold: false
    CreateBill: true
    VendorRef: "PO-${po_shenzhen}"
    Details:
    - {POOrderType: Normal, POOrderNbr: "${po_shenzhen}", POLineNbr: 1, ReceiptQty: 25}
    - {POOrderType: Normal, POOrderNbr: "${po_shenzhen}", POLineNbr: 2, ReceiptQty: 8}
  capture: {ReceiptNbr: rcpt_shenzhen}
- id: release-rcpt-shenzhen
  action: {entity: PurchaseReceipt, name: ReleasePurchaseReceipt}
  record: {Type: Receipt, ReceiptNbr: "${rcpt_shenzhen}"}
  wait:
    entity: PurchaseReceipt
    keys: [Receipt, "${rcpt_shenzhen}"]
    until: {Status: Released}
- id: billnbr-shenzhen
  get:
    entity: Bill
    filter: "VendorRef eq 'PO-${po_shenzhen}'"
    top: 1
  capture: {ReferenceNbr: bill_shenzhen}
- id: release-bill-shenzhen
  action: {entity: Bill, name: ReleaseBill}
  record: {Type: Bill, ReferenceNbr: "${bill_shenzhen}"}
  wait:
    entity: Bill
    keys: [Bill, "${bill_shenzhen}"]
    until: {Status: Open}
- id: pay-shenzhen
  put: Check
  record:
    Type: Payment
    Vendor: SHENZHEN
    PaymentMethod: WIRE
    CashAccount: '10100'
    PaymentAmount: 2045.00
    PaymentRef: "WIRE-AP-${bill_shenzhen}"
    Hold: false
    Details:
    - {DocType: Bill, ReferenceNbr: "${bill_shenzhen}", AmountPaid: 2045.00}
  capture: {ReferenceNbr: chk_shenzhen}
- id: release-pay-shenzhen
  action: {entity: Check, name: ReleaseCheck}
  record: {Type: Payment, ReferenceNbr: "${chk_shenzhen}"}
  wait:
    entity: Check
    keys: [Payment, "${chk_shenzhen}"]
    until: {Status: Closed}
- id: po-enclotec
  put: PurchaseOrder
  record:
    VendorID: ENCLOTEC
    Hold: false
    Details:
    - {InventoryID: ENCL-STD, OrderQty: 20, UnitCost: 22.00}
    - {InventoryID: ENCL-DIN, OrderQty: 8, UnitCost: 28.00}
  capture: {OrderNbr: po_enclotec}
- id: rcpt-enclotec
  put: PurchaseReceipt
  record:
    Type: Receipt
    VendorID: ENCLOTEC
    Hold: false
    CreateBill: true
    VendorRef: "PO-${po_enclotec}"
    Details:
    - {POOrderType: Normal, POOrderNbr: "${po_enclotec}", POLineNbr: 1, ReceiptQty: 20}
    - {POOrderType: Normal, POOrderNbr: "${po_enclotec}", POLineNbr: 2, ReceiptQty: 8}
  capture: {ReceiptNbr: rcpt_enclotec}
- id: release-rcpt-enclotec
  action: {entity: PurchaseReceipt, name: ReleasePurchaseReceipt}
  record: {Type: Receipt, ReceiptNbr: "${rcpt_enclotec}"}
  wait:
    entity: PurchaseReceipt
    keys: [Receipt, "${rcpt_enclotec}"]
    until: {Status: Released}
- id: billnbr-enclotec
  get:
    entity: Bill
    filter: "VendorRef eq 'PO-${po_enclotec}'"
    top: 1
  capture: {ReferenceNbr: bill_enclotec}
- id: release-bill-enclotec
  action: {entity: Bill, name: ReleaseBill}
  record: {Type: Bill, ReferenceNbr: "${bill_enclotec}"}
  wait:
    entity: Bill
    keys: [Bill, "${bill_enclotec}"]
    until: {Status: Open}
- id: pay-enclotec
  put: Check
  record:
    Type: Payment
    Vendor: ENCLOTEC
    PaymentMethod: WIRE
    CashAccount: '10100'
    PaymentAmount: 664.00
    PaymentRef: "WIRE-AP-${bill_enclotec}"
    Hold: false
    Details:
    - {DocType: Bill, ReferenceNbr: "${bill_enclotec}", AmountPaid: 664.00}
  capture: {ReferenceNbr: chk_enclotec}
- id: release-pay-enclotec
  action: {entity: Check, name: ReleaseCheck}
  record: {Type: Payment, ReferenceNbr: "${chk_enclotec}"}
  wait:
    entity: Check
    keys: [Payment, "${chk_enclotec}"]
    until: {Status: Closed}
- id: po-wavelink
  put: PurchaseOrder
  record:
    VendorID: WAVELINK
    Hold: false
    Details:
    - {InventoryID: ANT-LORA, OrderQty: 25, UnitCost: 12.00}
    - {InventoryID: ANT-LTE, OrderQty: 8, UnitCost: 16.00}
  capture: {OrderNbr: po_wavelink}
- id: rcpt-wavelink
