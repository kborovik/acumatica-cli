expect:
- get:
    entity: Bill
    keys: [Bill, "${bill_shenzhen}"]
  fields:
    Status: Closed
- get:
    entity: Check
    keys: [Payment, "${chk_shenzhen}"]
  fields:
    Status: Closed
- get:
    entity: Bill
    keys: [Bill, "${bill_enclotec}"]
  fields:
    Status: Closed
- get:
    entity: Check
    keys: [Payment, "${chk_enclotec}"]
  fields:
    Status: Closed
- get:
    entity: Bill
    keys: [Bill, "${bill_wavelink}"]
  fields:
    Status: Closed
- get:
    entity: Check
    keys: [Payment, "${chk_wavelink}"]
  fields:
    Status: Closed
- get:
    entity: Bill
    keys: [Bill, "${bill_memstor}"]
