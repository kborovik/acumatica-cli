# Snapshot view: GL trial balance (EndingBalance-class, V33).
# inquire: AccountSummaryInquiry — same contract inquiry as run expect/present
# (Ledger + Period pinned; Results projected by Account). gi: LAB5-TrialBalance
# remains optional when GenericInquiry is V12-verified and Expose via OData is on.
# After scenario/, `acu snapshot --assert-unchanged` is the idempotence gate (V32).
name: trial-balance
source:
  inquire: AccountSummaryInquiry
  params:
    Ledger: ACTUAL
    Period: "072026"
key:
  - Account
capture:
  - Description
  - BegBalance
  - DebitTotal
  - CreditTotal
  - EndingBalance
decimals: 2
