# Units of measure (CS203500) via the Default endpoint - EA for stock
# items; BOX second unit; PIECE/HOUR retained from scaffold.
# KG + LITER: company packaging base UOMs (Companies Weight/Volume UOM;
# Stock Items Packaging tab inherits them). Must exist before
# 91-company-packaging.yaml sets them on the org.
entity: UnitsOfMeasure
key: UnitID
records:
- UnitID: EA
  Description: Each
  L3Code: EA
- UnitID: BOX
  Description: Box
  L3Code: EA
- UnitID: PIECE
  Description: Piece
  L3Code: PCB
- UnitID: HOUR
  Description: Hour
  L3Code: HUR
- UnitID: KG
  Description: Kg
  L3Code: KGM
- UnitID: LITER
  Description: Liter
  L3Code: LTR
