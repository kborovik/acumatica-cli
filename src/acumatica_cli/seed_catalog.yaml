# seed_catalog.yaml - what `acu extract` reads off a live tenant and
# how each entity becomes a seed file (the inverse of apply).
# Hard-cut emit under config/{bootstrap,baseline,setup,master}/ (V30/V34).
#
# Per entity row:
#   entity    contract entity name (the GET source and the emitted `entity:`)
#   endpoint  omitted = the instance Default endpoint; the symbolic name
#             `bootstrap` stays symbolic in emitted files and resolves to
#             the active Bootstrap package version at HTTP/load time
#             (data-repo bootstrap/project.xml when present, else
#             packaged full company Bootstrap/1.0.0 - V20/V21/T81)
#   keys      key fields: the emitted `key:`, the record sort order, and
#             the B9 fallback's $select projection; the tuple must
#             identify each record (V25 - a dup tuple is a row failure)
#             and the FIRST key must be a primary-view field filterable
#             alone: diff's read-back filters on it and matches the rest
#             client-side, because a $filter AND spanning views answers
#             200 [] (B14/B21)
#   filter    OData $filter fragment riding both list reads (the plain
#             GET and the B9 $select fallback), so the per-key walk only
#             visits filtered keys; narrows extraction to configured
#             records when the entity serves tenant-native noise (T52)
#   file      destination path under the data root; numbered prefix encodes
#             apply order (V22: dir expansion sorts alphabetically, so a
#             record that references another entity must sort after the
#             file that creates it - B10). Extract hard-cut: config/ only.
#   strip     deny-list: live fields dropped from extracted records; the
#             inline reasons are load-bearing (B10/B11 knowledge as code)
#   include   allow-list: the only non-key fields kept (mutually
#             exclusive with strip); key fields always survive both
#   features  FeaturesSet gates the entity's screen needs (V22 feature
#             closure; consumed by the features.yaml synthesis)
#
# Per setup row (setup/ action files are synthesized, not record dumps -
# an action leaves no keyed record to extract, so each kind reads the
# live state the action created and derives the action file back):
#   kind      selects the synthesizer in extract.py
#   file      destination path; numbered prefixes encode apply order

entities:

# config/bootstrap/ - the virgin-tenant phase via the custom Bootstrap
# endpoint: built-in endpoints cannot create the first organization (C).

- entity: Company
  endpoint: bootstrap
  keys: [AcctCD]
  file: config/bootstrap/company.yaml

- entity: CreditTerms
  endpoint: bootstrap
  keys: [TermsID]
  file: config/bootstrap/credit-terms.yaml

# config/baseline/ - numbered prefixes encode the V22 reference chain:
# subaccounts < accounts < currencies < ledger < GL preferences <
# org-ledger link; units of measure reference nothing and sort last.

- entity: Subaccount
  keys: [SubaccountCD]
  file: config/baseline/10-subaccounts.yaml
  features: [SubAccount] # GL203000 is feature-gated (B15)
  strip:
  # server-assigned surrogate identity (instance-global sequence) - a
  # sourced value is another tenant's row number, so a replayed tenant
  # diffs dirty forever (B11 class, T50 round-trip)
  - SubaccountID
  # server audit stamp: every PUT moves it, so a sourced value is
  # permanent drift (B11 class)
  - LastModifiedDateTime

- entity: Account
  keys: [AccountCD]
  file: config/baseline/20-accounts.yaml
  strip:
  # references PM account groups outside the baseline set - absent on a
  # fresh tenant, PUT 422s (B10)
  - AccountGroup
  # references CM rate types outside the baseline set (B10 class, T31)
  - RevaluationRateType
  # server-derived: PUT-tolerated, the server keeps its own derivation,
  # so a sourced value diffs dirty forever (B11)
  - ChartOfAccountsOrder
  - CashAccount
  # server-assigned surrogate identity (B11 class, T50 round-trip)
  - AccountID
  # server audit stamps (B11 class)
  - CreatedDateTime
  - LastModifiedDateTime

# Multicurrency Currency (30-currencies) is not in the LAB5 template set
# (features.yaml deliberately omits Multicurrency). V34 equality: catalog
# file set = template seed set. Currency extract archaeology (B9 filter
# IsFinancial, Translation* strip) returns with T117 when a multicurrency
# seed is packaged.

- entity: Ledger
  keys: [LedgerID]
  file: config/baseline/40-ledger.yaml
  strip:
  # the server derives an Actual ledger's currency from the company base
  # currency - a sourced value is redundant or a rejected write (T34)
  - CurrencyID
  # server audit stamp (B11 class, T50 round-trip)
  - LastModifiedDateTime

- entity: GLPreferences
  endpoint: bootstrap
  keys: [RetEarnAccountID]
  file: config/baseline/50-gl-preferences.yaml

- entity: LedgerCompany
  endpoint: bootstrap
  # one record per org-ledger link: a multi-org tenant links several
  # organizations to one ledger, so LedgerCD alone under-keys the file
  # (B21) and the key is the pair. The pair spans two views - a $filter
  # AND across views answers 200 [] while each predicate alone matches
  # (B14) - so LedgerCD (the primary-view field) sits first: diff's
  # read-back filters on it alone and matches OrganizationID client-side
  keys: [LedgerCD, OrganizationID]
  file: config/baseline/60-ledger-company.yaml

- entity: UnitsOfMeasure
  keys: [UnitID]
  file: config/baseline/90-uoms.yaml

# Second Company PUT after UOMs exist (CS101500 packaging Weight/Volume).
# Strip/include archaeology for not-returned packaging fields is T118/B26;
# filter-split vs company.yaml is T117.
- entity: Company
  endpoint: bootstrap
  keys: [AcctCD]
  file: config/baseline/91-company-packaging.yaml

# config/master/ - path rows for V34 completeness (T116). Filter-split for
# multi-file Warehouse/StockItem and include/strip archaeology for large
# Default surfaces land in T117.

- entity: ReasonCode
  endpoint: bootstrap
  keys: [ReasonCodeID]
  file: config/master/10-reason-codes.yaml

- entity: INPreferences
  endpoint: bootstrap
  keys: [HoldEntry]
  file: config/master/20-in-preferences.yaml
  features: [Warehouse]

- entity: AvailabilityCalculationRule
  endpoint: bootstrap
  keys: [AvailabilitySchemeID]
  file: config/master/30-availability-rules.yaml

- entity: PostingClass
  endpoint: bootstrap
  keys: [PostClassID]
  file: config/master/40-posting-classes.yaml

- entity: Warehouse
  endpoint: bootstrap
  keys: [SiteCD]
  file: config/master/50-warehouse.yaml
  features: [Warehouse]

- entity: Warehouse
  endpoint: default
  keys: [WarehouseID]
  file: config/master/51-warehouse-locations.yaml
  features: [WarehouseLocation]

- entity: Warehouse
  endpoint: default
  keys: [WarehouseID]
  file: config/master/52-warehouse-defaults.yaml
  features: [WarehouseLocation]

- entity: TaxCategory
  keys: [TaxCategoryID]
  file: config/master/53-tax-categories.yaml

- entity: ItemClass
  keys: [ClassID]
  file: config/master/54-item-classes.yaml

- entity: SOPreferences
  endpoint: bootstrap
  keys: [DefaultOrderType]
  file: config/master/56-so-preferences.yaml

- entity: POPreferences
  endpoint: bootstrap
  keys: [HoldReceipts]
  file: config/master/57-po-preferences.yaml

- entity: OrderType
  endpoint: bootstrap
  keys: [OrderType]
  file: config/master/58-order-types.yaml

- entity: ARPreferences
  endpoint: bootstrap
  keys: [HoldEntry]
  file: config/master/60-ar-preferences.yaml

- entity: APPreferences
  endpoint: bootstrap
  keys: [HoldEntry]
  file: config/master/61-ap-preferences.yaml

- entity: CAPreferences
  endpoint: bootstrap
  keys: [TransitAcctId]
  file: config/master/62-ca-preferences.yaml

- entity: CashAccount
  endpoint: bootstrap
  keys: [CashAccountCD]
  file: config/master/63-cash-account.yaml

- entity: PaymentMethod
  keys: [PaymentMethodID]
  file: config/master/64-payment-methods.yaml

- entity: StatementCycle
  endpoint: bootstrap
  keys: [StatementCycleId]
  file: config/master/65-statement-cycles.yaml

- entity: VendorClass
  endpoint: bootstrap
  keys: [VendorClassID]
  file: config/master/70-vendor-classes.yaml

- entity: CustomerClass
  keys: [ClassID]
  file: config/master/71-customer-classes.yaml

- entity: Vendor
  keys: [VendorID]
  file: config/master/75-vendors.yaml

- entity: Customer
  keys: [CustomerID]
  file: config/master/76-customers.yaml

- entity: StockItem
  keys: [InventoryID]
  file: config/master/80-stock-items-parts.yaml

- entity: StockItem
  keys: [InventoryID]
  file: config/master/82-stock-items-kits.yaml

- entity: KitSpecification
  keys: [KitInventoryID, RevisionID]
  file: config/master/85-kit-specifications.yaml
  features: [KitAssemblies]

# config/setup/ - the GL action chain (T36/T37): financial-year setup,
# then calendar generation, then period activation; numbered prefixes
# mirror the verified apply order.

setup:

- kind: financial-year
  file: config/setup/10-financial-year.yaml

- kind: master-calendar
  file: config/setup/20-master-calendar.yaml

- kind: open-periods
  file: config/setup/30-open-periods.yaml
